name: Build KASIRKU APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Extract ZIP File
        run: unzip KASIRKU_Source_Code.zip -d ./source_code

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: 🔨 Build APK (Debug)
        working-directory: ./source_code
        run: gradle assembleDebug

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASIRKU-App
          path: ./source_code/app/build/outputs/apk/debug/app-debug.apk
          
